<!DOCTYPE html>
<html>
<head>
<title>Neuraxis</title>

<style>
body {
  margin:0;
  font-family:Arial;
  background:#0f172a;
  color:white;
  display:flex;
  height:100vh;
}

/* SIDEBAR */
.sidebar{
  width:260px;
  background:#020617;
  position:fixed;
  height:100%;
  left:-260px;
  transition:.3s;
  padding:15px;
  overflow-y:auto;
}
.sidebar.open{left:0;}

.logo{font-size:20px;margin-bottom:10px;}

.chat-item{
  padding:10px;
  background:#1e293b;
  margin-bottom:5px;
  border-radius:8px;
  cursor:pointer;
}

/* SETTINGS BUTTON */
.settings{
  position:fixed;
  bottom:15px;
  left:15px;
  font-size:20px;
  cursor:pointer;
}

/* MAIN */
.main{
  flex:1;
  display:flex;
  flex-direction:column;
  width:100%;
}

/* TOPBAR */
.topbar{
  padding:10px;
}

.menu-btn{
  font-size:22px;
  background:#2563eb;
  border:none;
  color:white;
  padding:8px 12px;
  border-radius:8px;
  cursor:pointer;
}

/* CHAT */
.chat{
  flex:1;
  overflow-y:auto;
  padding:20px 120px;
}

.msg{
  max-width:800px;
  margin-bottom:15px;
  padding:14px;
  border-radius:12px;
  white-space:pre-wrap;
}

.user{background:#2563eb;margin-left:auto;}
.ai{background:#1e293b;}

/* INPUT */
.input-area{
  position:sticky;
  bottom:0;
  display:flex;
  padding:15px;
  background:#020617;
}

input{
  flex:1;
  padding:14px;
  border-radius:12px;
  border:none;
  background:#1e293b;
  color:white;
}

.send{
  margin-left:10px;
  padding:0 18px;
  border:none;
  border-radius:12px;
  background:#2563eb;
  color:white;
}

/* FILE */
.file{
  margin-left:10px;
  cursor:pointer;
}

/* CODE */
pre{
  background:black;
  padding:10px;
  border-radius:10px;
  position:relative;
}

.copy-btn{
  position:absolute;
  top:5px;
  right:5px;
  background:#2563eb;
  border:none;
  color:white;
  padding:5px;
  cursor:pointer;
  border-radius:6px;
}

/* DOT */
.dot{
  width:6px;height:6px;
  background:white;
  display:inline-block;
  border-radius:50%;
  animation:blink 1s infinite;
}

@keyframes blink{
  0%{opacity:0}
  50%{opacity:1}
  100%{opacity:0}
}
</style>
</head>

<body>

<div class="sidebar" id="sidebar">
  <div class="logo">Neuraxis</div>
  <button onclick="newChat()">➕ Новый чат</button>
  <div id="chats"></div>
</div>

<div class="settings" onclick="alert('Настройки позже добавим')">⚙️</div>

<div class="main">

<div class="topbar">
  <button class="menu-btn" onclick="toggleSidebar()">☰</button>
</div>

<div id="chat" class="chat"></div>

<div class="input-area">
  <input id="message" placeholder="Напиши..." onkeydown="if(event.key==='Enter') sendMessage()">
  <button class="send" onclick="sendMessage()">➤</button>
  <input type="file" id="file" class="file">
</div>

</div>

<script>
let chats = JSON.parse(localStorage.getItem("chats")) || [];
let currentIndex = 0;

function save(){
  localStorage.setItem("chats", JSON.stringify(chats));
}

function toggleSidebar(){
  document.getElementById("sidebar").classList.toggle("open");
}

function newChat(){
  chats.push({title:"Новый чат", messages:[]});
  currentIndex = chats.length-1;
  renderChats();
  renderMessages();
  save();
}

function renderChats(){
  const el=document.getElementById("chats");
  el.innerHTML="";
  chats.forEach((c,i)=>{
    el.innerHTML+=`<div class="chat-item" onclick="openChat(${i})">${c.title}</div>`;
  });
}

function openChat(i){
  currentIndex=i;
  renderMessages();
}

function renderMessages(){
  const chat=document.getElementById("chat");
  chat.innerHTML="";
  chats[currentIndex].messages.forEach(m=>{
    chat.innerHTML+=`<div class="msg ${m.role}">${formatText(m.text)}</div>`;
  });
}

function formatText(text){
  return text.replace(/```(.*?)```/gs,(m,code)=>{
    return `<pre><button class="copy-btn" onclick="copyCode(this)">📋</button>${code}</pre>`;
  });
}

function copyCode(btn){
  const text=btn.parentElement.innerText.replace("📋","");
  navigator.clipboard.writeText(text);
  btn.innerText="✔";
  setTimeout(()=>btn.innerText="📋",1000);
}

async function sendMessage(){
  const input=document.getElementById("message");
  const msg=input.value;
  if(!msg)return;

  if(!chats[currentIndex]) newChat();

  chats[currentIndex].messages.push({role:"user", text:msg});

  renderMessages();
  input.value="";

  const chat=document.getElementById("chat");

  const aiDiv=document.createElement("div");
  aiDiv.className="msg ai";
  aiDiv.innerHTML="<span class='dot'></span>";
  chat.appendChild(aiDiv);

  chat.scrollTop=chat.scrollHeight;

  try{
    const res=await fetch("https://ai-backend-4txk.onrender.com/chat",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        message:msg
      })
    });

    const data=await res.json();
    const reply=data.choices?.[0]?.message?.content || "Ошибка";

    chats[currentIndex].messages.push({role:"ai", text:reply});

    if(chats[currentIndex].title==="Новый чат"){
      chats[currentIndex].title=msg.slice(0,20);
    }

    save();
    renderChats();
    renderMessages();

  }catch{
    aiDiv.innerText="Ошибка";
  }
}

renderChats();
</script>

</body>
</html>
