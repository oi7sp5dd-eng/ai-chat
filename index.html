<!DOCTYPE html>
<html>
<head>
<title>Neuraxis</title>

<style>
:root{
  --bg:#0f172a;
  --panel:#020617;
  --msg-ai:#1e293b;
  --msg-user:#2563eb;
  --text:white;
}

.light{
  --bg:#ffffff;
  --panel:#f1f5f9;
  --msg-ai:#e2e8f0;
  --msg-user:#2563eb;
  --text:black;
}

body{
  margin:0;
  font-family:Arial;
  background:var(--bg);
  color:var(--text);
  display:flex;
  height:100vh;
}

/* SIDEBAR */
.sidebar{
  width:260px;
  background:var(--panel);
  position:fixed;
  height:100%;
  left:-260px;
  transition:.3s;
  padding:15px;
}

.sidebar.open{left:0;}

.logo{font-size:20px;margin-bottom:10px;}

.settings{
  position:absolute;
  bottom:15px;
  left:15px;
  cursor:pointer;
}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column;width:100%;}

/* TOP */
.topbar{
  padding:10px;
}

.btn{
  background:#1e293b;
  border:none;
  color:white;
  padding:8px;
  border-radius:8px;
  cursor:pointer;
}

/* CHAT */
.chat{
  flex:1;
  overflow-y:auto;
  padding:20px 120px;
}

.msg{
  max-width:800px;
  margin-bottom:15px;
  padding:14px;
  border-radius:12px;
  white-space:pre-wrap;
}

.user{background:var(--msg-user);margin-left:auto;}
.ai{background:var(--msg-ai);}

/* INPUT */
.input-area{
  position:sticky;
  bottom:0;
  display:flex;
  padding:15px;
  background:var(--panel);
}

input{
  flex:1;
  padding:14px;
  border-radius:12px;
  border:none;
  background:#1e293b;
  color:white;
}

.send{
  margin-left:10px;
  padding:0 18px;
  border:none;
  border-radius:12px;
  background:#2563eb;
  color:white;
}

/* SETTINGS MODAL */
.modal{
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  background:rgba(0,0,0,.5);
  display:none;
  align-items:center;
  justify-content:center;
}

.modal-box{
  background:var(--panel);
  padding:20px;
  border-radius:12px;
  width:300px;
}

.option{
  padding:10px;
  cursor:pointer;
  border-radius:8px;
}

.option:hover{
  background:#1e293b;
}

/* typing dot */
.dot{
  width:6px;height:6px;
  border-radius:50%;
  display:inline-block;
  margin-left:5px;
  background:var(--text);
  animation:blink 1s infinite;
}

@keyframes blink{
  0%{opacity:0}
  50%{opacity:1}
  100%{opacity:0}
}
</style>
</head>

<body>

<div class="sidebar" id="sidebar">
  <div class="logo">Neuraxis</div>
  <div class="settings" onclick="openSettings()">⚙️</div>
</div>

<div class="main">

<div class="topbar">
  <button class="btn" onclick="toggleSidebar()">☰</button>
</div>

<div id="chat" class="chat"></div>

<div class="input-area">
  <input id="message" placeholder="Напиши..." onkeydown="if(event.key==='Enter') sendMessage()">
  <button class="send" onclick="sendMessage()">➤</button>
</div>

</div>

<!-- SETTINGS -->
<div class="modal" id="modal">
  <div class="modal-box">
    <h3>Настройки</h3>

    <p>Тема:</p>

    <div class="option" onclick="setTheme('default')">По умолчанию</div>
    <div class="option" onclick="setTheme('light')">Светлая</div>
    <div class="option" onclick="setTheme('dark')">Тёмная</div>

    <br>
    <button onclick="closeSettings()">Закрыть</button>
  </div>
</div>

<script>
function toggleSidebar(){
  document.getElementById("sidebar").classList.toggle("open");
}

function openSettings(){
  document.getElementById("modal").style.display="flex";
}

function closeSettings(){
  document.getElementById("modal").style.display="none";
}

function setTheme(theme){
  if(theme==="light"){
    document.body.classList.add("light");
    localStorage.setItem("theme","light");
  }else{
    document.body.classList.remove("light");
    localStorage.setItem("theme","dark");
  }
}

window.onload=()=>{
  if(localStorage.getItem("theme")==="light"){
    document.body.classList.add("light");
  }
}

async function sendMessage(){
  const input=document.getElementById("message");
  const chat=document.getElementById("chat");

  const msg=input.value;
  if(!msg)return;

  chat.innerHTML+=`<div class="msg user">${msg}</div>`;
  input.value="";

  const aiDiv=document.createElement("div");
  aiDiv.className="msg ai";
  aiDiv.innerHTML=`<span class="dot"></span>`;
  chat.appendChild(aiDiv);

  chat.scrollTop=chat.scrollHeight;

  try{
    const res=await fetch("https://ai-backend-4txk.onrender.com/chat",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({message:msg})
    });

    const data=await res.json();
    const reply=data.choices?.[0]?.message?.content || "Ошибка";

    aiDiv.innerHTML=reply;

  }catch{
    aiDiv.innerText="Ошибка";
  }
}
</script>

</body>
</html>
