<!DOCTYPE html>
<html>
<head>
<title>Neuraxis</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0f172a;
  color:white;
  display:flex;
  height:100vh;
}

/* SIDEBAR */
.sidebar{
  width:260px;
  background:#020617;
  position:fixed;
  height:100%;
  left:-260px;
  transition:.3s;
  padding:15px;
  z-index:5;
}
.sidebar.open{left:0;}

.logo{font-size:20px;margin-bottom:10px;}

.chat-item{
  padding:10px;
  background:#1e293b;
  margin-bottom:5px;
  border-radius:8px;
  cursor:pointer;
}

/* SETTINGS */
.settings{
  position:fixed;
  bottom:15px;
  left:15px;
  font-size:24px;
  color:white;
  cursor:pointer;
  z-index:10;
}

/* MENU BUTTON */
.menu-btn{
  position:fixed;
  top:10px;
  left:10px;
  font-size:22px;
  background:#2563eb;
  color:white;
  border:none;
  padding:10px 14px;
  border-radius:10px;
  cursor:pointer;
  z-index:20;
}

/* MAIN */
.main{
  flex:1;
  display:flex;
  flex-direction:column;
}

/* CHAT */
.chat{
  flex:1;
  overflow-y:auto;
  padding:60px 120px 20px 120px;
}

.msg{
  max-width:800px;
  margin-bottom:15px;
  padding:14px;
  border-radius:12px;
  white-space:pre-wrap;
}

.user{background:#2563eb;margin-left:auto;}
.ai{background:#1e293b;}

/* INPUT */
.input-area{
  position:sticky;
  bottom:0;
  display:flex;
  padding:10px;
  background:#020617;
}

input{
  flex:1;
  padding:12px;
  border-radius:10px;
  border:none;
  background:#1e293b;
  color:white;
}

.send{
  margin-left:10px;
  padding:0 15px;
  border:none;
  border-radius:10px;
  background:#2563eb;
  color:white;
}

/* CODE BLOCK */
pre{
  background:black;
  padding:10px;
  border-radius:10px;
  position:relative;
  overflow:auto;
}

.copy-btn{
  position:absolute;
  top:5px;
  right:5px;
  background:#2563eb;
  border:none;
  color:white;
  padding:5px;
  cursor:pointer;
}

/* DOT */
.dot{
  width:6px;height:6px;
  background:white;
  display:inline-block;
  border-radius:50%;
  animation:blink 1s infinite;
}

@keyframes blink{
  0%{opacity:0}
  50%{opacity:1}
  100%{opacity:0}
}

/* MODAL */
.modal{
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  background:rgba(0,0,0,.5);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:30;
}

.box{
  background:#020617;
  padding:20px;
  border-radius:10px;
  width:300px;
}
</style>
</head>

<body>

<div class="sidebar" id="sidebar">
  <div class="logo">Neuraxis</div>
  <button onclick="newChat()">➕ Новый чат</button>
  <div id="chats"></div>
</div>

<div class="settings" onclick="openSettings()">⚙️</div>
<button class="menu-btn" onclick="toggleSidebar()">☰</button>

<div class="main">

<div id="chat" class="chat"></div>

<div class="input-area">
  <input id="message" placeholder="Напиши..." onkeydown="if(event.key==='Enter') sendMessage()">
  <button class="send" onclick="sendMessage()">➤</button>
</div>

</div>

<!-- SETTINGS -->
<div class="modal" id="modal">
  <div class="box">
    <h3>Настройки</h3>
    <p>Тема и язык скоро будут</p>
    <button onclick="closeSettings()">Закрыть</button>
  </div>
</div>

<script>
let chats = JSON.parse(localStorage.getItem("chats")) || [];
let currentIndex = 0;

function save(){
  localStorage.setItem("chats", JSON.stringify(chats));
}

function toggleSidebar(){
  document.getElementById("sidebar").classList.toggle("open");
}

function openSettings(){
  document.getElementById("modal").style.display="flex";
}

function closeSettings(){
  document.getElementById("modal").style.display="none";
}

function newChat(){
  chats.push({title:"Новый чат",messages:[]});
  currentIndex=chats.length-1;
  renderChats();
  renderMessages();
  save();
}

function renderChats(){
  const el=document.getElementById("chats");
  el.innerHTML="";
  chats.forEach((c,i)=>{
    el.innerHTML+=`<div class="chat-item" onclick="openChat(${i})">${c.title}</div>`;
  });
}

function openChat(i){
  currentIndex=i;
  renderMessages();
}

function formatMessage(text){
  // код блоки ``` ```
  return text.replace(/```([\s\S]*?)```/g, (match, code)=>{
    return `<pre><button class="copy-btn" onclick="copyCode(this)">📋</button><code>${code}</code></pre>`;
  });
}

function renderMessages(){
  const chat=document.getElementById("chat");
  chat.innerHTML="";
  chats[currentIndex]?.messages.forEach(m=>{
    chat.innerHTML+=`<div class="msg ${m.role}">${formatMessage(m.text)}</div>`;
  });
}

function copyCode(btn){
  const code = btn.parentElement.innerText;
  navigator.clipboard.writeText(code);
  btn.innerText="✅";
  setTimeout(()=>btn.innerText="📋",1000);
}

async function sendMessage(){
  const input=document.getElementById("message");
  const msg=input.value;
  if(!msg)return;

  if(!chats[currentIndex]) newChat();

  chats[currentIndex].messages.push({role:"user",text:msg});
  renderMessages();
  input.value="";

  const chat=document.getElementById("chat");
  const aiDiv=document.createElement("div");
  aiDiv.className="msg ai";
  aiDiv.innerHTML="<span class='dot'></span>";
  chat.appendChild(aiDiv);

  try{
    const history = chats[currentIndex].messages.map(m => ({
      role: m.role === "user" ? "user" : "assistant",
      content: m.text
    }));

    const res=await fetch("https://ai-backend-4txk.onrender.com/chat",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        message: msg,
        history: history
      })
    });

    const data=await res.json();
    const reply=data.choices?.[0]?.message?.content || "Ошибка";

    chats[currentIndex].messages.push({role:"ai",text:reply});

    if(chats[currentIndex].title==="Новый чат"){
      chats[currentIndex].title=msg.slice(0,20);
    }

    save();
    renderChats();
    renderMessages();

  }catch{
    aiDiv.innerText="Ошибка подключения";
  }
}

renderChats();
</script>

</body>
</html>
